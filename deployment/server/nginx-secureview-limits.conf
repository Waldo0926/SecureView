# Tracked copy of /etc/nginx/conf.d/secureview-limits.conf on the MCS21 staging VPS.
#
# `limit_req_zone` has to live in the http block, not inside a server block, which is why
# this is a separate file in conf.d rather than part of nginx-secureview.conf.
#
# The application already throttles authentication: ten failures per account and fifty per
# IP inside a fifteen-minute window. That is the correct place for a policy about accounts,
# but every attempt below the threshold still costs a database transaction and a full
# Argon2id verification at 64 MiB. These limits stop a flood at the edge, before it can
# turn a deliberately expensive password hash into an amplifier.

# Every zone here keys on the client address, and on a campus or venue network that address
# is shared: the whole room sits behind one NAT and arrives as one IP. The rates below are
# sized so that about a hundred people using the site at the same time from one address do
# not trip them, while a script hammering one endpoint still does. The per-account limits in
# the application are what protect an individual account; these only protect the host.

# Ordinary API traffic. A page load is a handful of requests, so a hundred people loading
# My Files within the same minute is a few hundred requests a minute from one address.
limit_req_zone $binary_remote_addr zone=secureview_api:10m rate=30r/s;

# Only the routes that verify a credential or send mail (see the regex location in
# nginx-secureview.conf). Sixty a minute is a room full of people signing in at once; a
# guessing script wants thousands. Token refresh, /auth/me and logout are not in this zone:
# every open tab calls them, and they do not verify a password.
limit_req_zone $binary_remote_addr zone=secureview_auth:10m rate=60r/m;

# Uploads in flight at once, per source address. An upload holds its connection for as long
# as the body takes to arrive (minutes, for 500 MB on a slow link), so a request rate does not
# bound them; a connection count does. Threat model T-D2.
limit_conn_zone $binary_remote_addr zone=secureview_upload_conn:10m;
