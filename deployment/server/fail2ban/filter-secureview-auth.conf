# Tracked copy of /etc/fail2ban/filter.d/secureview-auth.conf on the MCS21 staging VPS.
#
# Matches a rejected credential on this site's access log. The application already blocks an
# account after ten failures and an IP after fifty, and nginx now rate-limits the same routes
# -- this is the third layer, and the only one that stops the host from talking to the
# attacker at all.
#
# Only the routes that check a password or a code count. /auth/me, /auth/sessions and
# /auth/logout also answer 401, but they do so for every tab whose access token has expired
# (thirty minutes), which is not an attack. Matching all of /api/v1/auth/ once banned a whole
# shared network because a few idle tabs kept polling with stale tokens. 429 is left out for
# the same reason: on a venue network the nginx rate limit is tripped by a crowd, not a script.

[Definition]
failregex = ^<HOST> .*"POST /api/v1/auth/(login|register|password-reset|change-password|delete-account|verification-codes/send)(\?[^ "]*)?" 401 
ignoreregex =
datepattern = %%d/%%b/%%Y:%%H:%%M:%%S %%z
