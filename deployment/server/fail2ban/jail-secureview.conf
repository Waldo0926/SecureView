# Tracked copy of /etc/fail2ban/jail.d/secureview.conf on the MCS21 staging VPS.
#
# SecureView had no jail at all: the two nginx jails on this host both read
# monash-tracker.error.log, which is a different project on the same server.

[secureview-auth]
enabled  = true
port     = http,https
filter   = secureview-auth
logpath  = /var/log/nginx/secureview.access.log
# Sixty rejected credentials in ten minutes from one address. Twenty was fine for one
# person but not for a lecture hall behind one NAT, where a few dozen people each mistyping
# once adds up. Sixty in ten minutes is still one wrong password every ten seconds, which a
# guessing script reaches in its first minute. The ban is fifteen minutes: with the whole
# room sharing one address, an hour would be a long time to lose the site for everyone, and
# the application's own per-account block (ten failures) is what actually protects an account.
maxretry = 60
findtime = 600
bantime  = 900
