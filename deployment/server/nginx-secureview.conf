# Tracked copy of /etc/nginx/sites-available/fyp-secure-file-platform on the
# MCS21 staging VPS.
#
# The 443 block is the real site, and answers on the bare IP as well as on the
# two host names. The 80 block only redirects browsers to the canonical origin
# and answers the two release probes; see docs/DEPLOYMENT.md section 5.
#
# Lines marked "managed by Certbot" were written by `certbot --nginx`. Re-running
# certbot rewrites them, so re-apply the loopback probe exception afterwards and
# compare against this file.
#
# Certificate paths assume `certbot --nginx -d secureview.tech -d www.secureview.tech`
# has already issued into /etc/letsencrypt/live/secureview.tech/.

server {
    server_name secureview.tech www.secureview.tech <server-ip>;

    root /opt/mcs21/current/frontend/dist;
    index index.html;

    server_tokens off;
    client_max_body_size 501m;

    # A log of its own, so the fail2ban filter reads this site's traffic and not the other
    # sites sharing this host.
    access_log /var/log/nginx/secureview.access.log;
    error_log  /var/log/nginx/secureview.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # The page must never be framed: it holds decrypted file contents and a passphrase box.
    add_header X-Frame-Options DENY always;
    # The app needs no camera, microphone, location, payment or USB access; say so, so a
    # compromised dependency cannot ask for them either.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # No other site may hold a window handle to this one or embed its responses.
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    # The bundle loads nothing from anywhere else -- no CDN, no external font -- so the
    # policy can be strict. Two deliberate relaxations:
    #
    #   'wasm-unsafe-eval'  Argon2id comes from hash-wasm, which is WebAssembly. Without
    #                       this, WebAssembly.instantiate is refused and registration,
    #                       unlocking and every passphrase operation fail. It permits WASM
    #                       compilation only -- it does not restore eval() or new Function().
    #   'unsafe-inline'     on style-src only, because Vue writes inline styles for
    #                       transitions. script-src does not get it.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Declared before /api/ so it wins: nginx picks the longest matching prefix.
    # Credential-verifying routes -- login, register, password reset, verification codes,
    # account deletion -- are the ones worth guessing at, and the ones that cost an Argon2id
    # verification per attempt.
    # Credential checks and outbound mail: the strict zone. A regex location wins over the
    # /api/v1/auth/ prefix below, so only these paths pay the auth rate; refresh, /auth/me,
    # logout and the avatar routes are ordinary API traffic.
    location ~ ^/api/v1/auth/(login|register|password-reset|change-password|delete-account|verification-codes/send)$ {
        limit_req zone=secureview_auth burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        include /etc/nginx/proxy_params;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/v1/auth/ {
        limit_req zone=secureview_api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        include /etc/nginx/proxy_params;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # At most ten uploads in flight per address. Not lower: a campus or office NAT puts many
    # people behind one address, and storage itself is capped per account by the backend.
    location = /api/v1/files/upload {
        # Uploads in flight from one address. Fifty, not ten: a venue network is one address
        # for everyone in the room, and the per-account storage quota bounds the total.
        limit_conn secureview_upload_conn 50;
        limit_conn_status 429;
        limit_req zone=secureview_api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        include /etc/nginx/proxy_params;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/ {
        limit_req zone=secureview_api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        include /etc/nginx/proxy_params;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /health/live {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
    }

    # Runtime metrics are deliberately host-local. Without an explicit block the SPA fallback
    # below would return index.html for /internal/*, which is not a data leak but makes the
    # public boundary ambiguous. Return a hard 404 instead and never proxy this prefix.
    location ^~ /internal/ {
        return 404;
    }

    location /docs {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;

        # FastAPI's generated Swagger page loads its bundle from jsDelivr and bootstraps it
        # with an inline script. Keep that exception on the documentation route only: the
        # main SecureView application retains the stricter self-only policy above because it
        # handles plaintext, passphrases and client-held keys.
        #
        # nginx does not inherit any server-level add_header directives once a location adds
        # one of its own, so repeat every security header rather than accidentally dropping
        # HSTS, frame denial or nosniff on this response.
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'unsafe-inline' https://cdn.jsdelivr.net; img-src data: https://fastapi.tiangolo.com; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    }

    location = /openapi.json {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
    }

    location /redoc {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;

        # ReDoc is generated by the same FastAPI helper and uses the same external bundle.
        # Match the route-scoped Swagger policy without weakening the application pages.
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'unsafe-inline' https://cdn.jsdelivr.net; img-src data: https://fastapi.tiangolo.com; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";

        # Adding Cache-Control here drops every server-level add_header (ZAP baseline,
        # 2026-10-04: the bundle was served without HSTS or nosniff), so repeat them.
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Resource-Policy same-origin always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/secureview.tech/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/secureview.tech/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.secureview.tech) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = secureview.tech) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name secureview.tech www.secureview.tech <server-ip>;

    # The release tooling probes http://127.0.0.1/health/live and
    # http://127.0.0.1/ with a bare-IP Host header, which the certbot redirects
    # above do not match. Keep exactly those two reachable, and only from
    # loopback, so an external client on the bare IP still gets nothing over
    # cleartext HTTP.
    root /opt/mcs21/current/frontend/dist;

    location = /health/live {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
    }

    # Everything else on port 80 goes to the canonical origin. The certbot
    # redirects above match only the two host names, so before this the bare IP
    # answered 404 over cleartext — indistinguishable from a dead backend to
    # anyone who reached the box by address rather than by name.
    location = / {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        # Loopback keeps its 200 for the release probe; everyone else turns the
        # access-phase 403 into the same redirect the other paths get.
        error_page 403 = @canonical;
        try_files /index.html =404;
    }

    # 308 rather than 301: a POST to /api/ over cleartext would otherwise come
    # back as a GET and fail with 405, which is a confusing way to learn that
    # you used the wrong scheme.
    location @canonical {
        return 308 https://secureview.tech$request_uri;
    }

    location / {
        return 308 https://secureview.tech$request_uri;
    }




}
