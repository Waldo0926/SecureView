# Drop-in for the server-only mcs21-backup.service (issue #57): email when it fails.
# The unit itself predates the repository; only this drop-in is tracked. Install with
#   sudo install -D -m 0644 deployment/server/mcs21-backup.service.d/alert.conf \
#     /etc/systemd/system/mcs21-backup.service.d/alert.conf
[Unit]
OnFailure=mcs21-alert@%n.service
